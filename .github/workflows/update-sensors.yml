name: Update sensor data

on:
  repository_dispatch:
    types: [update-sensors]
  workflow_dispatch:
    inputs:
      indoor_temperature:
        description: Indoor temperature
        required: false
      outdoor_temperature:
        description: Outdoor temperature
        required: false
      indoor_humidity:
        description: Indoor humidity
        required: false
      outdoor_humidity:
        description: Outdoor humidity
        required: false

permissions:
  contents: write

concurrency:
  group: update-sensors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sensor payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_UPDATED_AT: ${{ github.event.client_payload.updated_at }}
          DISPATCH_INDOOR_TEMPERATURE: ${{ github.event.client_payload.indoor_temperature }}
          DISPATCH_OUTDOOR_TEMPERATURE: ${{ github.event.client_payload.outdoor_temperature }}
          DISPATCH_INDOOR_HUMIDITY: ${{ github.event.client_payload.indoor_humidity }}
          DISPATCH_OUTDOOR_HUMIDITY: ${{ github.event.client_payload.outdoor_humidity }}
          INPUT_INDOOR_TEMPERATURE: ${{ inputs.indoor_temperature }}
          INPUT_OUTDOOR_TEMPERATURE: ${{ inputs.outdoor_temperature }}
          INPUT_INDOOR_HUMIDITY: ${{ inputs.indoor_humidity }}
          INPUT_OUTDOOR_HUMIDITY: ${{ inputs.outdoor_humidity }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const isDispatch = process.env.EVENT_NAME === "repository_dispatch";
          const getValue = (dispatchName, inputName) => (
            isDispatch ? process.env[dispatchName] : process.env[inputName]
          );
          const numberOrNull = (value) => {
            if (value === undefined || value === null || value === "") {
              return null;
            }

            const number = Number(value);
            return Number.isFinite(number) ? number : null;
          };

          const updatedAt = (
            isDispatch ? process.env.DISPATCH_UPDATED_AT : ""
          ) || new Date().toISOString();
          const sensors = {
            indoor_temperature: {
              value: numberOrNull(getValue("DISPATCH_INDOOR_TEMPERATURE", "INPUT_INDOOR_TEMPERATURE")),
              unit: "°C"
            },
            outdoor_temperature: {
              value: numberOrNull(getValue("DISPATCH_OUTDOOR_TEMPERATURE", "INPUT_OUTDOOR_TEMPERATURE")),
              unit: "°C"
            },
            indoor_humidity: {
              value: numberOrNull(getValue("DISPATCH_INDOOR_HUMIDITY", "INPUT_INDOOR_HUMIDITY")),
              unit: "%"
            },
            outdoor_humidity: {
              value: numberOrNull(getValue("DISPATCH_OUTDOOR_HUMIDITY", "INPUT_OUTDOOR_HUMIDITY")),
              unit: "%"
            }
          };

          fs.writeFileSync(
            "assets/data/sensors.json",
            JSON.stringify({ updated_at: updatedAt, sensors }, null, 2) + "\n"
          );

          const historyPath = "assets/data/sensors-history.json";
          const updatedTime = Date.parse(updatedAt);
          const cutoff = Number.isFinite(updatedTime)
            ? updatedTime - 7 * 24 * 60 * 60 * 1000
            : Date.now() - 7 * 24 * 60 * 60 * 1000;
          let points = [];

          if (fs.existsSync(historyPath)) {
            try {
              const history = JSON.parse(fs.readFileSync(historyPath, "utf8"));
              points = Array.isArray(history.points) ? history.points : [];
            } catch (error) {
              points = [];
            }
          }

          points = points
            .filter((point) => {
              const time = Date.parse(point.time);
              return Number.isFinite(time) && time >= cutoff && point.time !== updatedAt;
            })
            .concat({
              time: updatedAt,
              indoor_temperature: sensors.indoor_temperature.value,
              outdoor_temperature: sensors.outdoor_temperature.value,
              indoor_humidity: sensors.indoor_humidity.value,
              outdoor_humidity: sensors.outdoor_humidity.value
            })
            .sort((a, b) => Date.parse(a.time) - Date.parse(b.time));

          fs.writeFileSync(
            historyPath,
            JSON.stringify({ updated_at: updatedAt, points }, null, 2) + "\n"
          );
          NODE

      - name: Commit sensor payload
        run: |
          if git diff --quiet -- assets/data/sensors.json assets/data/sensors-history.json; then
            echo "No sensor data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/sensors.json assets/data/sensors-history.json
          git commit -m "Update sensor data"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
